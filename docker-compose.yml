services:
  backend:
    # The .NET SDK plus a PKCS#11 module for the YubiHSM, built for the
    # architecture of the machine this is running on. See docker/backend/Dockerfile.
    # The published image is multi-architecture, so `up` normally just pulls; the
    # build stanza is the fallback if it cannot be reached.
    image: ${BACKEND_IMAGE:-abratanov/medsign-backend:latest}
    build:
      context: ./docker/backend
    container_name: medsign-backend
    working_dir: /src
    command: bash /src/run-backend.sh
    stop_grace_period: 8s
    environment:
      # ---- Web host ------------------------------------------------------
      ASPNETCORE_URLS: http://+:${BACKEND_PORT:-5050}
      ASPNETCORE_ENVIRONMENT: Development

      # ---- Storage -------------------------------------------------------
      ConnectionStrings__MedSign: Data Source=/app/data/medsign.db

      # Report PDFs, beside the database in the same bind mount. It is the only
      # path that survives the watcher restarting the app, and the signature
      # over a file that is gone cannot be checked again.
      Storage__Root: /app/data

      MEDSIGN_ARTIFACTS: /artifacts
      MEDSIGN_STATUS_DIR: /status

      # ---- HSM / PKCS#11 -------------------------------------------------
      Hsm__ModulePath: ${HSM_MODULE_PATH:-/usr/lib/pkcs11/yubihsm_pkcs11.so}

      # Where run-backend.sh writes the connector address, and where the PKCS#11
      # module is told to read it. The two have to agree, so they share a
      # variable. Set HSM_CONNECTOR_URL in .env to reach a connector that is not
      # on this machine at the default port.
      Hsm__ConfPath: ${HSM_CONF_PATH:-/tmp/yubihsm_pkcs11.conf}
      HSM_CONF_PATH: ${HSM_CONF_PATH:-/tmp/yubihsm_pkcs11.conf}
      HSM_CONNECTOR_URL: ${HSM_CONNECTOR_URL:-http://192.168.8.20:12345}

      # The module reads this with getenv(), so it has to be in the real process
      # environment -- which is here, and only here. HsmCommunicator also sets it
      # from Hsm:ConfPath, but Environment.SetEnvironmentVariable on .NET for
      # Linux writes to a managed copy that no native library can see. That call
      # does reach native code on Windows, which is where this application was
      # first run, so the omission stayed invisible until it ran in a container:
      # the module simply found no configuration and refused to start, as
      # CKR_ARGUMENTS_BAD out of C_Initialize.
      YUBIHSM_PKCS11_CONF: ${HSM_CONF_PATH:-/tmp/yubihsm_pkcs11.conf}

      Hsm__KeyLabel: medsign-jwt-signing
      MEDSIGN_HSM_PIN: ${MEDSIGN_HSM_PIN:-}

      # ---- Passkeys (WebAuthn) -------------------------------------------
      Passkey__RpId: ${PASSKEY_RP_ID:-localhost}
      Passkey__RpName: MedSign Cloud
      Passkey__Origins__0: http://localhost:${FRONTEND_PORT:-4200}
      Passkey__Origins__1: http://localhost:${BACKEND_PORT:-5050}
      Passkey__TimeoutMs: "120000"
      Passkey__ChallengeLifetime: "00:05:00"

      # ---- JWT -----------------------------------------------------------
      Jwt__Issuer: https://medsign.example
      Jwt__Audience: medsign-cloud
      Jwt__LifetimeMinutes: "60"

      # The JWT signing key: an EC P-256 private key, PKCS#8, base64. Exercise 1 is
      # about the fact that you can read it right here, in a file that is committed
      # to this repository -- and that anyone who can is a doctor on every instance
      # of MedSign in the room. Exercise 2 is about fixing that. Override it in .env
      # if you want your own.
      MEDSIGN_JWT_SIGNING_KEY: "${MEDSIGN_JWT_SIGNING_KEY:-MIGHAgEAMBMGByqGSM49AgEGCCqGSM49AwEHBG0wawIBAQQgkjvRAiTO7MWILv7SF9Tbwy3/NZdE0s5bNS7dWglwKb6hRANCAATWnZ/NfLtprWztwxk/LPx6uPgXURM2HEDCEJUd8jY2/GXx1/gpQ5VQybPJVnbKa9BGLcOE9XP7k5HhpS6cgaGR}"

      # ---- dotnet watch --------------------------------------------------
      DOTNET_USE_POLLING_FILE_WATCHER: "1"
      DOTNET_WATCH_RESTART_ON_RUDE_EDIT: "1"
      DOTNET_WATCH_SUPPRESS_LAUNCH_BROWSER: "1"
      DOTNET_NOLOGO: "1"
    volumes:
      - ./backend:/src
      - ./data:/app/data
      - ./status:/status
      - artifacts:/artifacts
      - nuget:/root/.nuget/packages
    ports:
      - "${BACKEND_PORT:-5050}:${BACKEND_PORT:-5050}"
    # Docker Desktop resolves host.docker.internal on its own; a Linux host does
    # not, and the connector is only ever reachable there. Harmless on Desktop.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    tty: true
    stdin_open: true

  frontend:
    image: abratanov/medsign-frontend:latest
    # Published amd64-only; without this, compose cannot pull them on Apple silicon.
    platform: linux/amd64
    container_name: medsign-frontend
    environment:
      NGINX_PORT: ${FRONTEND_CONTAINER_PORT:-80}
      BACKEND_HOST: ${BACKEND_HOST:-localhost}
      BACKEND_PORT: ${BACKEND_PORT:-5050}
      BACKEND_ORIGIN: ${FRONTEND_BACKEND_ORIGIN:-}
    ports:
      - "${FRONTEND_PORT:-4200}:${FRONTEND_CONTAINER_PORT:-80}"
    restart: unless-stopped
    depends_on:
      - backend

  coach:
    image: abratanov/medsign-coach:latest
    # Published amd64-only; without this, compose cannot pull them on Apple silicon.
    platform: linux/amd64
    container_name: medsign-coach
    environment:
      NGINX_PORT: ${COACH_CONTAINER_PORT:-80}
      BACKEND_PORT: ${BACKEND_PORT:-5050}
      FRONTEND_PORT: ${FRONTEND_PORT:-4200}
    ports:
      - "${COACH_PORT:-4300}:${COACH_CONTAINER_PORT:-80}"
    volumes:
      - ./status:/usr/share/nginx/html/status:ro
      # The curriculum the dashboard groups tests by. The image ships the one it
      # was built with; this is the one the exercises in this repository
      # actually are, so it wins. Without it every exercise past the first is
      # unmatched and falls through to Foundations.
      - ./coach/exercises.js:/usr/share/nginx/html/exercises.js:ro
    restart: unless-stopped

volumes:
  nuget:

  artifacts:
