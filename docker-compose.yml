services:
  backend:
    image: mcr.microsoft.com/dotnet/sdk:10.0
    container_name: medsign-backend
    working_dir: /src
    command: bash /src/run-backend.sh
    stop_grace_period: 8s
    environment:
      ASPNETCORE_URLS: http://+:5000
      ASPNETCORE_ENVIRONMENT: Development

      ConnectionStrings__MedSign: Data Source=/app/data/medsign.db

      DOTNET_USE_POLLING_FILE_WATCHER: "1"

      MEDSIGN_ARTIFACTS: /artifacts

      MEDSIGN_STATUS_DIR: /status

      DOTNET_WATCH_RESTART_ON_RUDE_EDIT: "1"

      DOTNET_WATCH_SUPPRESS_LAUNCH_BROWSER: "1"
      DOTNET_NOLOGO: "1"
    volumes:
      - ./backend:/src
      - ./data:/app/data
      - ./status:/status
      - artifacts:/artifacts
      - nuget:/root/.nuget/packages
    ports:
      - "5050:5000"
    tty: true
    stdin_open: true

  frontend:
    image: abratanov/medsign-frontend:latest
    container_name: medsign-frontend
    # The published frontend currently has the API origin compiled into its
    # JavaScript bundle. Port 5000 is occupied by macOS AirPlay Receiver on a
    # default installation, so rewrite it to the workshop's host port while the
    # container starts. This can go away once the frontend accepts a runtime
    # API origin (or proxies /api to the backend).
    command:
      - /bin/sh
      - -c
      - |
        sed -i 's#http://localhost:5000#http://localhost:5050#g' /usr/share/nginx/html/*.js
        exec nginx -g 'daemon off;'
    ports:
      - "4200:80"
    restart: unless-stopped
    depends_on:
      - backend

  coach:
    image: abratanov/medsign-coach:latest
    container_name: medsign-coach
    ports:
      - "4300:80"
    volumes:
      - ./status:/usr/share/nginx/html/status:ro
    restart: unless-stopped

volumes:
  nuget:

  artifacts:
